[project]
name = "pre-review"
version = "0.1.0"
description = "Pre-review FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "olefile>=0.47,<1",
    "pyjwt>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pytest>=8,<9",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "rhwp-python==0.8.1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

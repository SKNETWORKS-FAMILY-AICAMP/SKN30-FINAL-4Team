[project]
name = "pre-review"
version = "0.1.0"
description = "Pre-review FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "olefile>=0.47,<1",
    # packages/profile_structuring 가 import 시점에 요구한다
    # (semantic_structuring/notice_preparation.py: from openai import OpenAI).
    # 우리 어댑터는 httpx 만 쓰지만, 벤더 패키지를 부르려면 있어야 한다.
    "openai>=2.26,<3",
    "pyjwt>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pdf-inspector==1.17.0",
    "pwdlib[argon2]>=0.3,<1",
    "pytest>=8,<9",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "rhwp-python==0.8.1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# L2's isolated classical serving runtime.  These are the versions used to
# build the frozen team artifacts; torch/transformers are deliberately not a
# part of the backend extra.
ml-classical = [
    "joblib==1.5.3",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "pyarrow==25.0.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "xgboost==3.4.1",
]
ml-model1 = [
    "torch==2.13.0",
    "transformers==5.13.0",
]

[tool.uv]
package = false

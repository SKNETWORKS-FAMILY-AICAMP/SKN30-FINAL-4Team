[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-review-backend"
version = "0.1.0"
description = "FastAPI and PostgreSQL-polling worker runtime for PreReview"
requires-python = ">=3.11"
dependencies = [
    "common-ir-pipeline[hwp]",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "langgraph>=0.2,<2.0",
    "openai>=2.26,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.1,<2.0",
    "tiktoken>=0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.uv.sources]
common-ir-pipeline = { path = "vendor/common_ir_pipeline" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

services:
  api:
    build:
      context: .
    restart: unless-stopped
    ports:
      # 기본은 host loopback 전용이다. LAN HTTP PoC는 .env에서 bind 주소와
      # Cookie Secure 예외를 둘 다 명시해야 한다.
      - "${PREREVIEW_API_BIND_ADDRESS:-127.0.0.1}:${PREREVIEW_API_PORT:-8001}:8000"
    environment:
      # Compose는 LAN에 publish될 수 있으므로 인증 우회가 없는 값을 기본으로 한다.
      # offline 계약 검증은 호스트에서 명시적으로 true로 실행한다.
      PREREVIEW_OFFLINE_MODE: "${PREREVIEW_OFFLINE_MODE:-false}"
      PREREVIEW_UPLOAD_MAX_BYTES: "${PREREVIEW_UPLOAD_MAX_BYTES:-52428800}"
      PREREVIEW_REPORT_MAX_BYTES: "${PREREVIEW_REPORT_MAX_BYTES:-26214400}"
      PREREVIEW_REPORT_DOWNLOAD_CONCURRENCY: "${PREREVIEW_REPORT_DOWNLOAD_CONCURRENCY:-2}"
      PREREVIEW_HTTP_MAX_BODY_BYTES: "${PREREVIEW_HTTP_MAX_BODY_BYTES:-53477376}"
      PREREVIEW_UPLOAD_CONCURRENCY: "${PREREVIEW_UPLOAD_CONCURRENCY:-2}"
      PREREVIEW_GLOBAL_QUEUE_MAX: "${PREREVIEW_GLOBAL_QUEUE_MAX:-25}"
      PREREVIEW_CURSOR_SIGNING_SECRET: "${PREREVIEW_CURSOR_SIGNING_SECRET:-}"
      PREREVIEW_AUTH_ALLOWED_ORIGINS: "${PREREVIEW_AUTH_ALLOWED_ORIGINS:-}"
      PREREVIEW_AUTH_SIGNUP_ENABLED: "${PREREVIEW_AUTH_SIGNUP_ENABLED:-false}"
      PREREVIEW_AUTH_COOKIE_SECURE: "${PREREVIEW_AUTH_COOKIE_SECURE:-true}"
      PREREVIEW_AUTH_COOKIE_SAMESITE: "${PREREVIEW_AUTH_COOKIE_SAMESITE:-lax}"
      PREREVIEW_AUTH_COOKIE_DOMAIN: "${PREREVIEW_AUTH_COOKIE_DOMAIN:-}"
      PREREVIEW_AUTH_REFRESH_COOKIE_MAX_AGE: "${PREREVIEW_AUTH_REFRESH_COOKIE_MAX_AGE:-2592000}"
      PREREVIEW_AUTH_PASSWORD_RESET_CALLBACK_URL: "${PREREVIEW_AUTH_PASSWORD_RESET_CALLBACK_URL:-}"
      PREREVIEW_AUTH_PASSWORD_RESET_REDIRECT_TO: "${PREREVIEW_AUTH_PASSWORD_RESET_REDIRECT_TO:-}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      SUPABASE_KEY: "${SUPABASE_KEY:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --limit-concurrency
      - "${PREREVIEW_API_LIMIT_CONCURRENCY:-32}"

  # Model 1(KLUE-BERT)을 CPU 메모리에 한 번 적재해 재사용하는 내부 sidecar.
  # host port와 외부 network를 갖지 않으며 DB/Supabase/OpenAI 자격증명도 받지 않는다.
  model1-cpu:
    build:
      context: ..
      dockerfile: backend/Dockerfile.ml-worker
    command:
      - /opt/prereview-ml-venv/bin/python
      - -m
      - uvicorn
      - prereview_model1_service.entrypoint:app
      - --host
      - 0.0.0.0
      - --port
      - "8791"
      - --workers
      - "1"
      - --no-access-log
    user: "${PREREVIEW_MODEL1_RUNTIME_UID:?set PREREVIEW_MODEL1_RUNTIME_UID to the Model 1 runtime owner UID}:${PREREVIEW_MODEL1_RUNTIME_GID:?set PREREVIEW_MODEL1_RUNTIME_GID to the Model 1 runtime owner GID}"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.runtime/model1-serving/model1-resident.env
    environment:
      PREREVIEW_MODEL1_DEPLOYMENT_PROFILE: "backend-cpu"
      PREREVIEW_MODEL1_DEVICE: "cpu"
      PREREVIEW_MODEL1_API_BEARER_TOKEN_FILE: "/run/secrets/prereview-model1-bearer"
      PREREVIEW_MODEL1_MAX_REQUEST_BYTES: "${PREREVIEW_MODEL1_MAX_REQUEST_BYTES:-65536}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      HF_HOME: "/tmp/.cache/huggingface"
      TORCH_HOME: "/tmp/.cache/torch"
      TRANSFORMERS_CACHE: "/tmp/.cache/transformers"
    volumes:
      - type: bind
        source: "${PREREVIEW_MODEL1_SERVING_HOST_DIR:?set PREREVIEW_MODEL1_SERVING_HOST_DIR to the verified Model 1 runtime directory}"
        target: /opt/prereview/model1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../.runtime/model1-serving/model1-service.token
        target: /run/secrets/prereview-model1-bearer
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /opt/prereview-ml-venv/bin/python
        - -m
        - prereview_model1_service.healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - model1-internal

  # Model 2(지원규모)와 Model 3(이상치)를 한 CPU 프로세스에 미리 적재한다.
  # 두 legacy serving graph가 import cache와 수치 연산 자원을 공유하므로 전역
  # 동시성은 1로 고정하며, DB/Storage/OpenAI 자격증명과 host port를 주지 않는다.
  model23-cpu:
    build:
      context: ..
      dockerfile: backend/Dockerfile.ml-worker
    command:
      - /opt/prereview-ml-venv/bin/python
      - -m
      - uvicorn
      - prereview_model23_service.entrypoint:app
      - --host
      - 0.0.0.0
      - --port
      - "8792"
      - --workers
      - "1"
      - --no-access-log
    user: "${PREREVIEW_MODEL1_RUNTIME_UID:?set PREREVIEW_MODEL1_RUNTIME_UID to the ML runtime owner UID}:${PREREVIEW_MODEL1_RUNTIME_GID:?set PREREVIEW_MODEL1_RUNTIME_GID to the ML runtime owner GID}"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.runtime/model23-serving/model23-resident.env
    environment:
      PREREVIEW_ML_ROOT: "/app/ml"
      PREREVIEW_MODEL23_API_BEARER_TOKEN_FILE: "/run/secrets/prereview-model23-bearer"
      PREREVIEW_MODEL23_MAX_REQUEST_BYTES: "${PREREVIEW_MODEL23_MAX_REQUEST_BYTES:-2097152}"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
    volumes:
      - type: bind
        source: ../.runtime/model23-serving/model23-service.token
        target: /run/secrets/prereview-model23-bearer
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /opt/prereview-ml-venv/bin/python
        - -m
        - prereview_model23_service.healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - model23-internal

  # 신뢰된 내부 polling worker. 포트는 열지 않으며, 브라우저/Edge callback을
  # 경유하지 않고 PostgreSQL queue와 private Storage만 사용한다. Model 1과
  # Model 2·3은 각각 인증된 CPU sidecar를 호출한다.
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.ml-worker
    command: ["python", "-m", "worker.main"]
    user: "${PREREVIEW_MODEL1_RUNTIME_UID:?set PREREVIEW_MODEL1_RUNTIME_UID to the Model 1 runtime owner UID}:${PREREVIEW_MODEL1_RUNTIME_GID:?set PREREVIEW_MODEL1_RUNTIME_GID to the Model 1 runtime owner GID}"
    restart: unless-stopped
    # SIGTERM 후 현재 claim을 정리할 시간을 준다. 배포 전 queue drain이 우선이다.
    stop_grace_period: 10m
    depends_on:
      model1-cpu:
        condition: service_healthy
        restart: true
      model23-cpu:
        condition: service_healthy
        restart: true
    env_file:
      - ../.runtime/model1-serving/model1-resident.env
      - ../.runtime/model23-serving/model23-resident.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:-}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      # LLM execution is selectable; retrieval embeddings remain explicitly
      # OpenAI-backed until a separately versioned embedding migration exists.
      PREREVIEW_LLM_PROVIDER: "${PREREVIEW_LLM_PROVIDER:-openai}"
      PREREVIEW_EMBEDDING_PROVIDER: "${PREREVIEW_EMBEDDING_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_LLM_MODEL: "${OPENAI_LLM_MODEL:-}"
      OPENAI_REQUEST_PROFILE_MODEL: "${OPENAI_REQUEST_PROFILE_MODEL:-gpt-5.6-terra}"
      OPENAI_CPL_MODEL: "${OPENAI_CPL_MODEL:-}"
      OPENAI_FIT_MODEL: "${OPENAI_FIT_MODEL:-}"
      OPENAI_SIM_MODEL: "${OPENAI_SIM_MODEL:-}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-120}"
      OPENAI_MAX_REPAIRS: "${OPENAI_MAX_REPAIRS:-2}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      VLLM_LLM_MODEL: "${VLLM_LLM_MODEL:-}"
      VLLM_REQUEST_PROFILE_MODEL: "${VLLM_REQUEST_PROFILE_MODEL:-}"
      VLLM_CPL_MODEL: "${VLLM_CPL_MODEL:-}"
      VLLM_FIT_MODEL: "${VLLM_FIT_MODEL:-}"
      VLLM_SIM_MODEL: "${VLLM_SIM_MODEL:-}"
      VLLM_CHAT_MODEL: "${VLLM_CHAT_MODEL:-}"
      VLLM_TIMEOUT_SECONDS: "${VLLM_TIMEOUT_SECONDS:-120}"
      VLLM_MAX_REPAIRS: "${VLLM_MAX_REPAIRS:-2}"
      VLLM_MAX_OUTPUT_TOKENS: "${VLLM_MAX_OUTPUT_TOKENS:-16384}"
      VLLM_MAX_RESPONSE_BYTES: "${VLLM_MAX_RESPONSE_BYTES:-1048576}"
      PREREVIEW_WORKER_HEARTBEAT_SECONDS: "${PREREVIEW_WORKER_HEARTBEAT_SECONDS:-30}"
      PREREVIEW_WORKER_LEASE_SECONDS: "${PREREVIEW_WORKER_LEASE_SECONDS:-120}"
      PREREVIEW_WORKER_IDLE_POLL_SECONDS: "${PREREVIEW_WORKER_IDLE_POLL_SECONDS:-1}"
      PREREVIEW_WORKER_TOP_K: "${PREREVIEW_WORKER_TOP_K:-5}"
      PREREVIEW_EXISTING_KB_REQUIRED: "${PREREVIEW_EXISTING_KB_REQUIRED:-true}"
      # Prepared Existing-profile diagnostic seam. The active polling worker
      # does not call it yet; default off keeps the historical path unchanged.
      PREREVIEW_EXISTING_COMPOSITE_CANDIDATE_MODE: "${PREREVIEW_EXISTING_COMPOSITE_CANDIDATE_MODE:-off}"
      # Request is an active worker path. Existing is a prepared importer/
      # producer seam. Both remain byte-shape compatible at the off default.
      PREREVIEW_REQUEST_NATIVE_EXACT_CANDIDATE_MODE: "${PREREVIEW_REQUEST_NATIVE_EXACT_CANDIDATE_MODE:-off}"
      PREREVIEW_EXISTING_NATIVE_EXACT_CANDIDATE_MODE: "${PREREVIEW_EXISTING_NATIVE_EXACT_CANDIDATE_MODE:-off}"
      PREREVIEW_WORKER_STORAGE_TIMEOUT_SECONDS: "${PREREVIEW_WORKER_STORAGE_TIMEOUT_SECONDS:-30}"
      PREREVIEW_WORKER_DATABASE_CONNECT_TIMEOUT_SECONDS: "${PREREVIEW_WORKER_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
      PREREVIEW_WORKER_PARSE_TIMEOUT_SECONDS: "${PREREVIEW_WORKER_PARSE_TIMEOUT_SECONDS:-120}"
      # rhwp의 native FreeType 호환성은 parser subprocess에만 적용된다.
      PREREVIEW_FREETYPE_LIB: "${PREREVIEW_FREETYPE_LIB:-/usr/lib/x86_64-linux-gnu/libfreetype.so.6}"
      # Model 1 and Model 2/3 are resident in separate authenticated internal
      # CPU sidecars. The worker keeps no mutable model process state.
      PREREVIEW_ML_ROOT: "/app/ml"
      # Dockerfile.ml-worker also serves the standalone Model 1 container and
      # therefore carries a local runtime default.  The polling worker must
      # clear it explicitly when it uses the authenticated sidecar instead.
      PREREVIEW_MODEL1_SERVING_DIR: ""
      PREREVIEW_MODEL1_REMOTE_BASE_URL: "http://model1-cpu:8791"
      PREREVIEW_MODEL1_REMOTE_BEARER_TOKEN_FILE: "/run/secrets/prereview-model1-bearer"
      PREREVIEW_MODEL1_INTERNAL_HTTP_HOSTNAME: "model1-cpu"
      PREREVIEW_MODEL1_MAX_REQUEST_BYTES: "${PREREVIEW_MODEL1_MAX_REQUEST_BYTES:-65536}"
      PREREVIEW_MODEL23_REMOTE_BASE_URL: "http://model23-cpu:8792"
      PREREVIEW_MODEL23_REMOTE_BEARER_TOKEN_FILE: "/run/secrets/prereview-model23-bearer"
      PREREVIEW_MODEL23_INTERNAL_HTTP_HOSTNAME: "model23-cpu"
      PREREVIEW_MODEL23_MAX_REQUEST_BYTES: "${PREREVIEW_MODEL23_MAX_REQUEST_BYTES:-2097152}"
      PREREVIEW_ML_PYTHON_EXECUTABLE: "/opt/prereview-ml-venv/bin/python"
      PREREVIEW_ML_TIMEOUT_SECONDS: "${PREREVIEW_ML_TIMEOUT_SECONDS:-180}"
      PREREVIEW_STRICT_ML_RUNTIME_PREFLIGHT: "true"
      # Compose starts under a numeric artifact owner that may not have a
      # passwd entry. All caches/scratch writes stay on the tmpfs below.
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      HF_HOME: "/tmp/.cache/huggingface"
      TORCH_HOME: "/tmp/.cache/torch"
      TRANSFORMERS_CACHE: "/tmp/.cache/transformers"
    volumes:
      - type: bind
        source: ../.runtime/model1-serving/model1-service.token
        target: /run/secrets/prereview-model1-bearer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../.runtime/model23-serving/model23-service.token
        target: /run/secrets/prereview-model23-bearer
        read_only: true
        bind:
          create_host_path: false
    # Source/artifacts are image-local and the Model 1 secret is read-only.
    # Parser/model scratch space is explicitly limited to /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - model1-internal
      - model23-internal

  # 분석 완료 건의 CPL/FIT/SIM/ML 결과만 근거로 답하는 비동기 Chat worker.
  # 분석 worker와 queue/RPC가 분리되어 긴 문서 분석이 대화 응답을 막지 않는다.
  chat-worker:
    build:
      context: .
    command: ["python", "-m", "worker.chat_main"]
    restart: unless-stopped
    stop_grace_period: 3m
    environment:
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      DATABASE_URL: "${DATABASE_URL:-}"
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:-}"
      PREREVIEW_LLM_PROVIDER: "${PREREVIEW_LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_LLM_MODEL: "${OPENAI_LLM_MODEL:-}"
      OPENAI_CHAT_MODEL: "${OPENAI_CHAT_MODEL:-}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-120}"
      OPENAI_MAX_REPAIRS: "${OPENAI_MAX_REPAIRS:-2}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      VLLM_LLM_MODEL: "${VLLM_LLM_MODEL:-}"
      VLLM_CHAT_MODEL: "${VLLM_CHAT_MODEL:-}"
      VLLM_TIMEOUT_SECONDS: "${VLLM_TIMEOUT_SECONDS:-120}"
      VLLM_MAX_REPAIRS: "${VLLM_MAX_REPAIRS:-2}"
      VLLM_MAX_OUTPUT_TOKENS: "${VLLM_MAX_OUTPUT_TOKENS:-16384}"
      VLLM_MAX_RESPONSE_BYTES: "${VLLM_MAX_RESPONSE_BYTES:-1048576}"
      PREREVIEW_CHAT_WORKER_HEARTBEAT_SECONDS: "${PREREVIEW_CHAT_WORKER_HEARTBEAT_SECONDS:-30}"
      PREREVIEW_CHAT_WORKER_LEASE_SECONDS: "${PREREVIEW_CHAT_WORKER_LEASE_SECONDS:-120}"
      PREREVIEW_CHAT_WORKER_IDLE_POLL_SECONDS: "${PREREVIEW_CHAT_WORKER_IDLE_POLL_SECONDS:-1}"
      PREREVIEW_CHAT_DATABASE_CONNECT_TIMEOUT_SECONDS: "${PREREVIEW_CHAT_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 분석 결과를 오프라인 HTML 템플릿으로 렌더링하는 전용 PDF worker.
  # Chromium은 프로세스 수명 동안 유지하고 작업별로 격리된 page만 연다.
  report-worker:
    build:
      context: .
      dockerfile: Dockerfile.report-worker
    command: ["python", "-m", "worker.report_main"]
    restart: unless-stopped
    stop_grace_period: 3m
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:-}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      PREREVIEW_REPORT_CHROMIUM_EXECUTABLE: "/usr/bin/chromium"
      PREREVIEW_REPORT_WORKER_HEARTBEAT_SECONDS: "${PREREVIEW_REPORT_WORKER_HEARTBEAT_SECONDS:-30}"
      PREREVIEW_REPORT_WORKER_LEASE_SECONDS: "${PREREVIEW_REPORT_WORKER_LEASE_SECONDS:-120}"
      PREREVIEW_REPORT_WORKER_IDLE_POLL_SECONDS: "${PREREVIEW_REPORT_WORKER_IDLE_POLL_SECONDS:-1}"
      PREREVIEW_REPORT_RENDER_TIMEOUT_SECONDS: "${PREREVIEW_REPORT_RENDER_TIMEOUT_SECONDS:-60}"
      PREREVIEW_REPORT_STORAGE_TIMEOUT_SECONDS: "${PREREVIEW_REPORT_STORAGE_TIMEOUT_SECONDS:-30}"
      PREREVIEW_REPORT_DATABASE_CONNECT_TIMEOUT_SECONDS: "${PREREVIEW_REPORT_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
      PREREVIEW_REPORT_MAX_BYTES: "${PREREVIEW_REPORT_MAX_BYTES:-26214400}"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
    mem_limit: "${PREREVIEW_REPORT_WORKER_MEMORY_LIMIT:-1g}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  model1-internal:
    internal: true
  model23-internal:
    internal: true

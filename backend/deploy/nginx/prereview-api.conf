# PreReview FastAPI reverse proxy example.
# Keep client_max_body_size at 51 MiB (53,477,376 bytes), matching
# PREREVIEW_HTTP_MAX_BODY_BYTES=53477376.  FastAPI separately enforces the
# extracted-file cap PREREVIEW_UPLOAD_MAX_BYTES=52428800 (50 MiB).

upstream prereview_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Whole multipart request cap: boundary, headers, every part and file.
    client_max_body_size 51m;

    location / {
        proxy_pass http://prereview_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
